<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Clean Audio Player - Library Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 24px;
      width: 100%;
      max-width: 820px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0;
      color: #38bdf8;
    }
    .version-tag {
      font-size: 0.75rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }
    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 600px) {
      .inputs-grid { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 5px;
      font-weight: 500;
    }
    select, input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.9rem;
      outline: none;
    }
    select:focus, input[type="file"]:focus {
      border-color: #38bdf8;
    }
    .or-divider {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin: 4px 0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Resume Notification Banner */
    .resume-banner {
      display: none;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #e0f2fe;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn-small {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .btn-small:hover { background: #475569; }

    /* Big Custom Progress Bar */
    .progress-section {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px 18px;
      margin: 16px 0;
    }
    .time-readout {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    .seek-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 22px;
      background: #1e293b;
      border-radius: 11px;
      outline: none;
      cursor: pointer;
      border: 2px solid #475569;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      border: 2px solid #ffffff;
    }
    .seek-slider::-moz-range-thumb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      border: 2px solid #ffffff;
    }

    /* Primary Player Controls */
    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .btn-control {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-control:hover { background: #475569; }
    .btn-play-pause {
      background: #0284c7;
      padding: 12px 28px;
      font-size: 1.1rem;
    }
    .btn-play-pause:hover { background: #0369a1; }

    /* Speed Selector Inside Controls */
    .speed-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .speed-wrapper label {
      margin: 0;
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 700;
    }
    .speed-select {
      background: transparent;
      color: #38bdf8;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 4px;
      cursor: pointer;
      outline: none;
      width: auto;
    }

    audio {
      width: 100%;
      display: none;
    }

    .status-badge {
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border: 1px solid #334155;
      margin-top: 14px;
    }
    .status-normal { color: #10b981; }
    .status-muted {
      color: #f43f5e;
      background: rgba(244, 63, 94, 0.2);
      border-color: #f43f5e;
    }
    .status-error {
      color: #f87171;
      background: rgba(239, 68, 68, 0.18);
      border-color: #ef4444;
    }
    .debug-box {
      margin-top: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.82rem;
      color: #94a3b8;
      font-family: monospace;
    }
    .btn-test {
      margin-top: 12px;
      width: 100%;
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    .control-item {
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-row">
      <h1>Clean Audio Player</h1>
      <span class="version-tag">AUTO-RESUME & SPEED</span>
    </div>

    <!-- Resume Banner -->
    <div id="resumeBanner" class="resume-banner">
      <span id="resumeText">Progress restored: 00:00:00</span>
      <button id="btnResetProgress" class="btn-small">Restart from 0:00</button>
    </div>

    <div class="inputs-grid">
      <!-- Section 1: Filter Map Selection (Dropdown OR Direct File Picker) -->
      <div>
        <label for="bookSelect">1. Choose Cloud Filter Map:</label>
        <select id="bookSelect">
          <option value="censor_map.json">Cowboy Casual (Book 1)</option>
          <option value="book2_map.json">Audiobook 2</option>
        </select>

        <div class="or-divider">— OR Pick Local .JSON File —</div>

        <input type="file" id="jsonFileInput" accept=".json,application/json">
      </div>

      <!-- Section 2: Audio File Picker -->
      <div>
        <label for="audioFile">2. Select Audio (.m4b, .mp3, .aac):</label>
        <input type="file" id="audioFile" accept="audio/*,audio/mp3,audio/mpeg,audio/x-m4a,audio/mp4">
      </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <!-- Big Progress & Playback Bar -->
    <div class="progress-section">
      <div class="time-readout">
        <span id="currentTimeDisplay">00:00:00</span>
        <span id="totalTimeDisplay">--:--:--</span>
      </div>
      <input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0" step="0.1">

      <div class="player-controls">
        <button id="btnBack15" class="btn-control">⏪ 15s</button>
        <button id="btnPlayPause" class="btn-control btn-play-pause">▶ Play</button>
        <button id="btnForward15" class="btn-control">15s ⏩</button>

        <!-- Playback Speed Control up to 2x -->
        <div class="speed-wrapper">
          <label for="speedSelect">Speed:</label>
          <select id="speedSelect" class="speed-select">
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="1.75">1.75x</option>
            <option value="2.0">2.0x</option>
          </select>
        </div>
      </div>
    </div>

    <div id="statusBadge" class="status-badge status-normal">Loading filter map...</div>

    <div class="debug-box" id="debugBox">
      Time: 0.00s | Filters: 0 | Next Mute: None
    </div>

    <button id="jumpFirstBtn" class="btn-test" style="display:none;">Jump to 5s Before First Mute</button>

    <div class="controls-grid">
      <div class="control-item">
        <span>Mute Words</span>
        <input type="checkbox" id="muteToggle" checked>
      </div>
      <div class="control-item">
        <span>Skip Scenes</span>
        <input type="checkbox" id="skipToggle" checked>
      </div>
    </div>
  </div>

  <script>
    const audioPlayer = document.getElementById('audioPlayer');
    const audioFileInput = document.getElementById('audioFile');
    const jsonFileInput = document.getElementById('jsonFileInput');
    const bookSelect = document.getElementById('bookSelect');
    const speedSelect = document.getElementById('speedSelect');
    const statusBadge = document.getElementById('statusBadge');
    const debugBox = document.getElementById('debugBox');
    const muteToggle = document.getElementById('muteToggle');
    const skipToggle = document.getElementById('skipToggle');
    const jumpFirstBtn = document.getElementById('jumpFirstBtn');

    const resumeBanner = document.getElementById('resumeBanner');
    const resumeText = document.getElementById('resumeText');
    const btnResetProgress = document.getElementById('btnResetProgress');

    const seekSlider = document.getElementById('seekSlider');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const totalTimeDisplay = document.getElementById('totalTimeDisplay');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnBack15 = document.getElementById('btnBack15');
    const btnForward15 = document.getElementById('btnForward15');

    const PADDING_SECONDS = 0.35;
    let filterEvents = [];
    let monitorInterval = null;
    let isUserSeeking = false;
    let currentObjectUrl = null;
    let currentBookKey = 'censor_map.json';
    let pendingResumeTime = 0;

    function formatTime(sec) {
      if (isNaN(sec) || sec === Infinity || sec < 0) return "--:--:--";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // ==========================================
    // LOCAL STORAGE MEMORY (Auto-Save & Resume)
    // ==========================================
    function getStorageKey(bookKey) {
      return `clean_audio_pos_${bookKey.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
    }

    function saveCurrentProgress() {
      if (audioPlayer.src && !isNaN(audioPlayer.currentTime) && audioPlayer.currentTime > 0) {
        localStorage.setItem(getStorageKey(currentBookKey), audioPlayer.currentTime);
      }
    }

    function checkSavedProgress() {
      const saved = localStorage.getItem(getStorageKey(currentBookKey));
      if (saved && !isNaN(parseFloat(saved))) {
        pendingResumeTime = parseFloat(saved);
        if (pendingResumeTime > 5) {
          resumeBanner.style.display = 'flex';
          resumeText.textContent = `Saved bookmark found: ${formatTime(pendingResumeTime)}`;
        } else {
          pendingResumeTime = 0;
          resumeBanner.style.display = 'none';
        }
      } else {
        pendingResumeTime = 0;
        resumeBanner.style.display = 'none';
      }
    }

    btnResetProgress.addEventListener('click', () => {
      audioPlayer.currentTime = 0;
      pendingResumeTime = 0;
      localStorage.removeItem(getStorageKey(currentBookKey));
      resumeBanner.style.display = 'none';
      currentTimeDisplay.textContent = '00:00:00';
      seekSlider.value = 0;
      statusBadge.textContent = 'Progress reset to beginning (0:00)';
    });

    // Restore saved playback speed
    const savedSpeed = localStorage.getItem('clean_audio_speed');
    if (savedSpeed) {
      speedSelect.value = savedSpeed;
      audioPlayer.playbackRate = parseFloat(savedSpeed);
    }

    speedSelect.addEventListener('change', () => {
      const rate = parseFloat(speedSelect.value);
      audioPlayer.playbackRate = rate;
      localStorage.setItem('clean_audio_speed', rate);
    });

    function applyFilterData(rawEvents, sourceLabel, bookKey) {
      currentBookKey = bookKey || sourceLabel;
      filterEvents = rawEvents.map(item => ({
        ...item,
        expandedStart: Math.max(0, item.start - PADDING_SECONDS),
        expandedEnd: item.end + PADDING_SECONDS
      })).sort((a, b) => a.start - b.start);

      statusBadge.className = 'status-badge status-normal';
      statusBadge.textContent = `${sourceLabel} Loaded (${filterEvents.length} filters) • Ready`;
      if (filterEvents.length > 0) {
        jumpFirstBtn.style.display = 'block';
        jumpFirstBtn.textContent = `Jump to 5s Before First Mute (${Math.max(0, filterEvents[0].start - 5).toFixed(0)}s)`;
      } else {
        jumpFirstBtn.style.display = 'none';
      }

      checkSavedProgress();
      updateDebug(audioPlayer.currentTime || 0);
    }

    // Fetch from GitHub Repo
    function loadCensorMap(filename) {
      statusBadge.className = 'status-badge status-normal';
      statusBadge.textContent = `Loading ${filename}...`;
      jumpFirstBtn.style.display = 'none';

      fetch('./' + filename)
        .then(response => {
          if (!response.ok) throw new Error('File not found: ' + filename);
          return response.json();
        })
        .then(rawEvents => {
          const bookName = bookSelect.options[bookSelect.selectedIndex].text;
          applyFilterData(rawEvents, bookName, filename);
        })
        .catch(err => {
          console.warn('Map load error:', err);
          statusBadge.className = 'status-badge status-error';
          statusBadge.textContent = `Error: ${filename} not found in repo root`;
          filterEvents = [];
        });
    }

    // Direct JSON File Picker (Device Local File)
    jsonFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (Array.isArray(parsed)) {
            applyFilterData(parsed, file.name, file.name);
          } else {
            throw new Error('JSON format is not an array');
          }
        } catch (err) {
          statusBadge.className = 'status-badge status-error';
          statusBadge.textContent = 'Invalid JSON filter file!';
        }
      };
      reader.readAsText(file);
    });

    bookSelect.addEventListener('change', () => {
      jsonFileInput.value = '';
      loadCensorMap(bookSelect.value);
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadCensorMap(bookSelect.value);
    });

    // Handle Audio File Selection
    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const sizeMB = (file.size / (1024 * 1024)).toFixed(1);

      if (file.size === 0) {
        statusBadge.className = 'status-badge status-error';
        statusBadge.textContent = 'Error: File is 0 MB. Download fully to device first!';
        return;
      }

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }

      currentObjectUrl = URL.createObjectURL(file);
      audioPlayer.src = currentObjectUrl;

      audioPlayer.muted = false;
      audioPlayer.volume = 1.0;
      audioPlayer.playbackRate = parseFloat(speedSelect.value);
      audioPlayer.load();

      btnPlayPause.textContent = '▶ Play';
      statusBadge.className = 'status-badge status-normal';
      statusBadge.textContent = `Loaded ${file.name.slice(0, 24)} (${sizeMB} MB) • Ready`;
    });

    audioPlayer.addEventListener('error', (e) => {
      let msg = 'Playback error';
      if (audioPlayer.error) {
        switch (audioPlayer.error.code) {
          case 1: msg = 'Aborted file fetch'; break;
          case 2: msg = 'Network error downloading file'; break;
          case 3: msg = 'Audio decode error (corrupt file/tags)'; break;
          case 4: msg = 'Format not supported by browser'; break;
        }
      }
      statusBadge.className = 'status-badge status-error';
      statusBadge.textContent = `Audio Error: ${msg}`;
      btnPlayPause.textContent = '▶ Play';
    });

    // When audio metadata is ready, restore saved position if available
    audioPlayer.addEventListener('loadedmetadata', () => {
      if (audioPlayer.duration && !isNaN(audioPlayer.duration) && audioPlayer.duration !== Infinity) {
        seekSlider.max = audioPlayer.duration;
        totalTimeDisplay.textContent = formatTime(audioPlayer.duration);
      } else {
        totalTimeDisplay.textContent = '--:--:--';
      }

      // Restore position if bookmark exists
      if (pendingResumeTime > 0 && pendingResumeTime < (audioPlayer.duration || Infinity)) {
        audioPlayer.currentTime = pendingResumeTime;
        seekSlider.value = pendingResumeTime;
        currentTimeDisplay.textContent = formatTime(pendingResumeTime);
        resumeText.textContent = `Resumed from ${formatTime(pendingResumeTime)}`;
      }
    });

    audioPlayer.addEventListener('durationchange', () => {
      if (audioPlayer.duration && !isNaN(audioPlayer.duration) && audioPlayer.duration !== Infinity) {
        seekSlider.max = audioPlayer.duration;
        totalTimeDisplay.textContent = formatTime(audioPlayer.duration);
      }
    });

    // Play / Pause
    btnPlayPause.addEventListener('click', () => {
      if (!audioPlayer.src || audioPlayer.src === "") {
        statusBadge.className = 'status-badge status-error';
        statusBadge.textContent = 'Please select an audio file first!';
        return;
      }

      if (audioPlayer.paused) {
        audioPlayer.playbackRate = parseFloat(speedSelect.value);
        const playPromise = audioPlayer.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              btnPlayPause.textContent = '⏸ Pause';
              statusBadge.className = 'status-badge status-normal';
              statusBadge.textContent = 'Playing Clean';
            })
            .catch(err => {
              console.error('Play error:', err);
              btnPlayPause.textContent = '▶ Play';
              statusBadge.className = 'status-badge status-error';
              statusBadge.textContent = `Cannot Play: Tap again or check file`;
            });
        }
      } else {
        audioPlayer.pause();
        saveCurrentProgress();
        btnPlayPause.textContent = '▶ Play';
      }
    });

    btnBack15.addEventListener('click', () => {
      if (audioPlayer.src) {
        audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 15);
        saveCurrentProgress();
      }
    });

    btnForward15.addEventListener('click', () => {
      if (audioPlayer.src) {
        audioPlayer.currentTime = Math.min(audioPlayer.duration || Infinity, audioPlayer.currentTime + 15);
        saveCurrentProgress();
      }
    });

    seekSlider.addEventListener('input', () => {
      isUserSeeking = true;
      currentTimeDisplay.textContent = formatTime(seekSlider.value);
    });

    seekSlider.addEventListener('change', () => {
      if (audioPlayer.src) {
        audioPlayer.currentTime = seekSlider.value;
        saveCurrentProgress();
        checkCensor();
      }
      isUserSeeking = false;
    });

    jumpFirstBtn.addEventListener('click', () => {
      if (filterEvents.length > 0 && audioPlayer.src) {
        audioPlayer.currentTime = Math.max(0, filterEvents[0].start - 5);
        audioPlayer.play().then(() => {
          btnPlayPause.textContent = '⏸ Pause';
        }).catch(() => {});
      }
    });

    function updateDebug(currentTime) {
      if (!filterEvents.length) {
        debugBox.textContent = `Time: ${currentTime.toFixed(2)}s | Filters: 0`;
        return;
      }
      const upcoming = filterEvents.find(f => f.end > currentTime);
      const nextInfo = upcoming ? `"${upcoming.word}" at ${upcoming.start.toFixed(1)}s` : 'None left';
      debugBox.textContent = `Time: ${currentTime.toFixed(2)}s | Filters: ${filterEvents.length} | Next: ${nextInfo}`;
    }

    let saveCounter = 0;

    function checkCensor() {
      const currentTime = audioPlayer.currentTime;

      if (!isUserSeeking && !isNaN(currentTime)) {
        seekSlider.value = currentTime;
        currentTimeDisplay.textContent = formatTime(currentTime);
      }

      // Auto-save every ~3 seconds during playback
      saveCounter++;
      if (saveCounter % 90 === 0) {
        saveCurrentProgress();
      }

      if (!filterEvents.length) return;
      updateDebug(currentTime);

      let matched = false;

      for (let i = 0; i < filterEvents.length; i++) {
        const item = filterEvents[i];
        if (currentTime >= item.expandedStart && currentTime <= item.expandedEnd) {
          matched = true;

          if (item.action === 'skip' && skipToggle.checked) {
            audioPlayer.currentTime = item.expandedEnd + 0.05;
            statusBadge.className = 'status-badge status-muted';
            statusBadge.textContent = `[SKIPPED: ${item.category || 'Explicit Scene'}]`;
            return;
          }

          if ((item.action === 'mute' || item.action === 'bleep') && muteToggle.checked) {
            audioPlayer.muted = true;
            audioPlayer.volume = 0;
            statusBadge.className = 'status-badge status-muted';
            statusBadge.textContent = `[MUTING: "${item.word || 'explicit'}"]`;
            return;
          }
        }
      }

      if (!matched) {
        if (audioPlayer.muted || audioPlayer.volume === 0) {
          audioPlayer.muted = false;
          audioPlayer.volume = 1.0;
        }
        statusBadge.className = 'status-badge status-normal';
        statusBadge.textContent = 'Playback Clean';
      }
    }

    audioPlayer.addEventListener('play', () => {
      btnPlayPause.textContent = '⏸ Pause';
      if (monitorInterval) clearInterval(monitorInterval);
      monitorInterval = setInterval(checkCensor, 35);
    });

    audioPlayer.addEventListener('pause', () => {
      btnPlayPause.textContent = '▶ Play';
      saveCurrentProgress();
      if (monitorInterval) clearInterval(monitorInterval);
    });

    audioPlayer.addEventListener('timeupdate', checkCensor);
    audioPlayer.addEventListener('seeking', checkCensor);

    // Save progress on page unload or app minimize
    window.addEventListener('beforeunload', saveCurrentProgress);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        saveCurrentProgress();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW active:', reg.scope))
          .catch(err => console.error('SW error:', err));
      });
    }
  </script>
</body>
